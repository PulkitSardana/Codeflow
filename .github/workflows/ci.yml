name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: CODEFLOW_RUN_NETWORK_TESTS=1 npm test
      - run: npm run test:e2e
      - run: npm run audit:production
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-node-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Regression smoke check
        run: |
          npx --no-install codeflow record --output .codeflow/before.json -- node examples/demo.js
          CODEFLOW_DEMO_REGRESSION=1 npx --no-install codeflow record --output .codeflow/after.json -- node examples/demo.js
          if npx --no-install codeflow compare .codeflow/before.json .codeflow/after.json --threshold 20; then
            echo "Expected CodeFlow to detect the intentional demo regression"
            exit 1
          fi
