name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: CODEFLOW_RUN_NETWORK_TESTS=1 npm test
      - run: npm run test:e2e
      - run: npm run audit
      - run: npm run audit:production
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-node-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Regression smoke check
        run: |
          npm run codeflow -- record --output .codeflow/before.json -- node examples/demo.js
          CODEFLOW_DEMO_REGRESSION=1 npm run codeflow -- record --output .codeflow/after.json -- node examples/demo.js
          if npm run codeflow -- compare .codeflow/before.json .codeflow/after.json --threshold 20; then
            echo "Expected CodeFlow to detect the intentional demo regression"
            exit 1
          fi
